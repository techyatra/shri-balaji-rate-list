<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Balaji Traders &amp; A.P. Traders - Rate List</title>
<style>
  :root {
    --ink:#20262d; --muted:#7a8690; --line:#dde4e8;
    --accent:#3f7d8c; --accent-dark:#2c5964; --accent-soft:#eaf4f5;
    --warn-bg:#fff8e8; --warn-border:#eecb84;
    --head-bg:#e8f2f3; --head-ink:#2c5964;
    --ok-bg:#e6f4ea; --ok-ink:#1e7a3c; --ok-strong:#2e9e52;
    --err-bg:#fdeceb; --err-ink:#b3261e;
    --field-bg:#f6f8f9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans Devanagari", Arial, sans-serif;
    color: var(--ink); background: #f2f5f6; margin: 0; padding: 0 0 60px;
  }
  header {
    background: linear-gradient(135deg,#eaf6f2,#eef3fb 55%,#fdf3e9);
    padding: 14px 12px 12px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 6;
  }
  header h1 { margin: 0 0 3px; font-size: 16.5px; color: var(--accent-dark); line-height: 1.3; }
  header .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 9px; }
  .pill-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 5px 12px; font-size: 11.5px; font-weight: 600;
  }
  .sync-pill.connecting { background: #eef3fb; color: var(--accent-dark); border: 1px solid #cfe0e6; }
  .sync-pill.online { background: var(--ok-bg); color: var(--ok-ink); border: 1px solid #bfe3c9; }
  .sync-pill.offline { background: var(--err-bg); color: var(--err-ink); border: 1px solid #f2c6c2; }
  .refresh-btn {
    font-size: 11.5px; padding: 5px 12px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--accent); background: #fff; cursor: pointer; color: var(--accent-dark);
  }
  .refresh-btn:active { background: var(--accent-soft); }
  .wrap { max-width: 100%; margin: 0 auto; padding: 0 10px; }
  .search-bar { margin: 10px 0; display: flex; gap: 8px; }
  .search-bar input {
    flex: 1; padding: 11px 13px; font-size: 15px; border: 1.5px solid var(--line);
    border-radius: 12px; outline: none; background: #fff;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .add-toggle-btn {
    flex-shrink: 0; padding: 0 16px; font-size: 14px; font-weight: 700; border-radius: 12px;
    border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .add-toggle-btn:active { background: var(--accent-dark); }
  .stats { font-size: 12px; color: var(--muted); margin: 2px 2px 8px; }

  .add-panel {
    display: none; background: #fff; border: 1.5px solid var(--accent); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .add-panel.open { display: block; }
  .add-panel h3 { margin: 0 0 10px; font-size: 14px; color: var(--accent-dark); }
  .add-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px;
  }
  .add-grid label { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 3px; }
  .add-grid input {
    width: 100%; border: 1.5px solid var(--line); background: var(--field-bg); font-size: 13px;
    padding: 8px 9px; border-radius: 8px; font-family: inherit; color: var(--ink);
  }
  .add-grid input:focus { border-color: var(--accent); background: #fff; outline: none; }
  .add-actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .btn-add-submit { background: var(--ok-strong); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-add-submit:disabled { opacity: .5; }
  .btn-add-cancel { background: #fff; color: var(--muted); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
  .add-status { font-size: 12px; }
  .add-status.ok { color: var(--ok-ink); }
  .add-status.err { color: var(--err-ink); }

  .bill-toggle-btn {
    flex-shrink: 0; padding: 0 14px; font-size: 14px; font-weight: 700; border-radius: 12px;
    border: none; background: #8a5a2c; color: #fff; cursor: pointer;
  }
  .bill-toggle-btn:active { background: #6e4722; }
  .bill-panel {
    display: none; background: #fff; border: 1.5px solid #8a5a2c; border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .bill-panel.open { display: block; }
  .bill-panel h3 { margin: 0 0 10px; font-size: 14px; color: #6e4722; }
  .bill-head-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; margin-bottom: 12px;
  }
  .bill-head-grid label { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 3px; }
  .bill-head-grid input, .bill-head-grid select {
    width: 100%; border: 1.5px solid var(--line); background: var(--field-bg); font-size: 13px;
    padding: 8px 9px; border-radius: 8px; font-family: inherit; color: var(--ink);
  }
  .bill-head-grid input:focus, .bill-head-grid select:focus { border-color: #8a5a2c; background: #fff; outline: none; }
  .bill-search-wrap { position: relative; margin-bottom: 10px; }
  .bill-search-wrap input {
    width: 100%; border: 1.5px solid var(--line); background: var(--field-bg); font-size: 13.5px;
    padding: 10px 11px; border-radius: 8px; font-family: inherit; color: var(--ink);
  }
  .bill-search-wrap input:focus { border-color: #8a5a2c; background: #fff; outline: none; }
  .bill-suggest {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
    background: #fff; border: 1.5px solid var(--line); border-radius: 10px; max-height: 210px;
    overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,.12);
  }
  .bill-suggest.open { display: block; }
  .bill-suggest-item { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .bill-suggest-item:last-child { border-bottom: none; }
  .bill-suggest-item:hover, .bill-suggest-item.active { background: var(--accent-soft); }
  .bill-suggest-item .s-sub { font-size: 10.5px; color: var(--muted); }
  .bill-add-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 12px; flex-wrap: wrap; }
  .bill-add-row .picked { flex: 1 1 180px; font-size: 13px; padding: 9px 10px; background: var(--field-bg); border-radius: 8px; border: 1.5px solid var(--line); min-height: 38px; }
  .bill-add-row .picked.empty { color: var(--muted); }
  .bill-add-row input { width: 80px; border: 1.5px solid var(--line); background: var(--field-bg); font-size: 13px; padding: 9px 9px; border-radius: 8px; font-family: inherit; }
  .bill-add-row label { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 3px; }
  .btn-bill-add { background: #8a5a2c; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-bill-add:disabled { opacity: .5; }
  table.bill-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
  table.bill-table th { text-align: left; font-size: 10.5px; color: var(--muted); text-transform: uppercase; padding: 5px 6px; border-bottom: 1.5px solid var(--line); }
  table.bill-table td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.bill-table input { width: 100%; border: 1.5px solid var(--line); background: var(--field-bg); font-size: 13px; padding: 5px 6px; border-radius: 6px; font-family: inherit; text-align: right; }
  table.bill-table .btn-rm { background: var(--err-bg); color: var(--err-ink); border: none; border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer; }
  .bill-totals { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-size: 13.5px; margin-bottom: 12px; }
  .bill-totals .trow { display: flex; gap: 14px; align-items: center; }
  .bill-totals .trow input { width: 100px; border: 1.5px solid var(--line); background: var(--field-bg); font-size: 13px; padding: 6px 8px; border-radius: 6px; text-align: right; font-family: inherit; }
  .bill-totals .grand { font-size: 16px; font-weight: 800; color: #6e4722; }
  .bill-actions { display: flex; gap: 8px; }
  .btn-bill-print { background: #6e4722; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .btn-bill-clear { background: #fff; color: var(--muted); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; cursor: pointer; }
  .bill-empty-hint { font-size: 12.5px; color: var(--muted); padding: 10px 0; text-align: center; }

  #printArea { display: none; }

  .table-scroll {
    overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px;
    border: 1px solid var(--line); background: #fff;
  }
  table { width: 100%; min-width: 1055px; border-collapse: collapse; font-size: 12.5px; background: #fff; table-layout: fixed; }
  col.c-seq { width: 40px; } col.c-vendor { width: 110px; } col.c-hi { width: 120px; } col.c-en { width: 110px; }
  col.c-rate { width: 70px; } col.c-unit { width: 60px; } col.c-amount { width: 80px; }
  col.c-qty { width: 50px; } col.c-selling { width: 75px; }
  col.c-note { width: 135px; } col.c-verify { width: 70px; } col.c-actions { width: 150px; }
  thead th {
    background: var(--head-bg); color: var(--head-ink); text-align: left;
    padding: 9px 7px; font-size: 11px; white-space: nowrap; font-weight: 700;
    position: sticky; top: 0; z-index: 2;
  }
  thead th:nth-child(2), tbody td:nth-child(2) {
    position: sticky; left: 40px; z-index: 3; background: inherit;
    box-shadow: 2px 0 4px rgba(0,0,0,.04);
  }
  thead th:nth-child(2) { z-index: 4; background: var(--head-bg); }
  thead th:first-child, tbody td:first-child {
    position: sticky; left: 0; z-index: 3; background: inherit;
    text-align: center; color: var(--muted); font-weight: 700;
  }
  thead th:first-child { z-index: 4; background: var(--head-bg); }
  tbody td { padding: 6px 7px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:nth-child(even) td:first-child, tbody tr:nth-child(even) td:nth-child(2) { background: #fff; }
  tbody tr:nth-child(odd) td:first-child, tbody tr:nth-child(odd) td:nth-child(2) { background: #fbfdfd; }
  tbody tr:hover { background: #f5f9fa; }
  tr.unsure td { background: var(--warn-bg) !important; }
  tr.unsure:hover td { background: #fdf1d8 !important; }
  .vendor-text { font-size: 10.5px; color: var(--muted); max-width: 140px; display: block; line-height: 1.3; }

  input.cell {
    width: 100%; max-width: 100%; border: 1.5px solid var(--line); background: var(--field-bg); font-size: 12.5px;
    padding: 6px 6px; border-radius: 7px; font-family: inherit; color: var(--ink); overflow: hidden; text-overflow: ellipsis;
  }
  input.cell:focus { border-color: var(--accent); background: #fff; outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  input.cell.changed { border-color: #d9a441; background: #fffaf0; }
  input.num { text-align: right; }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap; }
  .badge.yes { background: var(--warn-bg); color: #8a6414; border: 1px solid var(--warn-border); }
  .badge.no { background: var(--ok-bg); color: var(--ok-ink); border: 1px solid #bfe3c9; }
  .badge.neutral { background: #eef1f2; color: var(--muted); border: 1px solid var(--line); }

  .actions-cell { display: flex; flex-direction: row; flex-wrap: wrap; gap: 4px; align-items: center; }
  .btn { border: none; border-radius: 7px; font-size: 10.5px; font-weight: 700; padding: 6px 7px; cursor: pointer; white-space: nowrap; }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:active { background: var(--accent-dark); }
  .btn-save:disabled { opacity: .5; }
  .btn-verify { background: #fff; color: var(--ok-strong); border: 1.5px solid var(--ok-strong); }
  .btn-verify:active { background: var(--ok-bg); }
  .btn-verify.done { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-bg); cursor: default; opacity: .85; }
  .row-status { font-size: 10px; min-width: 50px; }
  .row-status.ok { color: var(--ok-ink); }
  .row-status.err { color: var(--err-ink); }

  .empty, .loading { padding: 30px; text-align: center; color: var(--muted); }
  .footer-note { padding: 14px 8px 10px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }

  #toastHost { position: fixed; left: 0; right: 0; top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 999; padding: 0 10px; }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px;
    max-width: 94%; box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; transform: translateY(-8px);
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { background: var(--ok-strong); }
  .toast.err { background: var(--err-ink); }
  .toast b { font-weight: 700; }

  @media (max-width: 760px) {
    header h1 { font-size: 14.5px; }
    table { min-width: 970px; font-size: 11px; }
    .btn { padding: 6px 7px; font-size: 10.5px; }
    .toast { font-size: 12.5px; }
  }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      display: block; position: absolute; left: 0; top: 0; width: 100%;
      padding: 18px; font-family: Arial, "Noto Sans Devanagari", sans-serif; color: #000;
    }
    .pr-head { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 14px; }
    .pr-head h2 { margin: 0 0 3px; font-size: 19px; }
    .pr-head .pr-sub { font-size: 12px; color: #333; }
    .pr-title { text-align: center; font-size: 15px; font-weight: 700; margin: 8px 0 14px; text-decoration: underline; }
    .pr-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 12px; }
    .pr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pr-table th, .pr-table td { border: 1px solid #000; padding: 6px 8px; }
    .pr-table th { background: #eee; text-align: left; }
    .pr-table td.num, .pr-table th.num { text-align: right; }
    .pr-totals { width: 100%; margin-top: 2px; border-collapse: collapse; font-size: 13px; }
    .pr-totals td { padding: 5px 8px; border: none; }
    .pr-totals td.lbl { text-align: right; color: #333; }
    .pr-totals td.val { text-align: right; width: 120px; font-weight: 700; }
    .pr-totals tr.grand td { font-size: 15px; font-weight: 800; border-top: 2px solid #000; }
    .pr-foot { margin-top: 30px; display: flex; justify-content: space-between; font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>Sri Balaji Traders &amp; A.P. Traders — Rate List</h1>
  <div class="sub">Wholesale Perfume &amp; General Stock · Tirupati</div>
  <div class="pill-row">
    <span id="syncPill" class="sync-pill connecting">⏳ Connecting…</span>
    <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
  </div>
</header>
<div class="wrap">
  <div class="search-bar">
    <input id="searchBox" type="text" placeholder="Item ढूंढें... (Hindi/English/vendor)" autocomplete="off">
    <button class="add-toggle-btn" id="addToggleBtn">+ Add Item</button>
    <button class="bill-toggle-btn" id="billToggleBtn">🧾 New Bill</button>
  </div>
  <div class="bill-panel" id="billPanel">
    <h3>नया Bill बनाएं</h3>
    <div class="bill-head-grid">
      <div><label>Type</label>
        <select id="bill_type">
          <option value="Quotation">Quotation</option>
          <option value="Kaccha Bill">Kaccha Bill</option>
          <option value="Challan">Challan</option>
        </select>
      </div>
      <div><label>Customer Name</label><input id="bill_customer" placeholder="Customer ka naam"></div>
      <div><label>Date</label><input id="bill_date" readonly></div>
    </div>

    <div class="bill-search-wrap">
      <input id="billSearch" type="text" placeholder="SKU search karein (Hindi/English)..." autocomplete="off">
      <div class="bill-suggest" id="billSuggest"></div>
    </div>
    <div class="bill-add-row">
      <div>
        <label>Picked Item</label>
        <div class="picked empty" id="billPicked">Koi item select nahi kiya</div>
      </div>
      <div><label>Qty</label><input id="bill_qty" inputmode="decimal" value="1"></div>
      <div><label>Rate (₹)</label><input id="bill_rate" inputmode="decimal"></div>
      <button class="btn-bill-add" id="billAddBtn" disabled>➕ Bill me jodein</button>
    </div>

    <div id="billTableHost"><div class="bill-empty-hint">Abhi koi item bill me nahi hai — upar search karke add karein</div></div>

    <div class="bill-totals">
      <div class="trow"><span>Subtotal</span><span id="billSubtotal">₹0</span></div>
      <div class="trow"><span>Discount (₹)</span><input id="bill_discount" inputmode="decimal" value="0"></div>
      <div class="trow grand"><span>Grand Total</span><span id="billGrandTotal">₹0</span></div>
    </div>

    <div class="bill-actions">
      <button class="btn-bill-print" id="billPrintBtn">🖨️ Print / Save PDF</button>
      <button class="btn-bill-clear" id="billClearBtn">Clear</button>
    </div>
  </div>
  <div class="add-panel" id="addPanel">
    <h3>नया item जोड़ें</h3>
    <div class="add-grid">
      <div><label>Vendor</label><input id="add_vendor" placeholder="jaise: Baseda Anil ji"></div>
      <div><label>Hindi Name</label><input id="add_item_hi"></div>
      <div><label>English Name</label><input id="add_item_en"></div>
      <div><label>Rate</label><input id="add_rate" inputmode="decimal"></div>
      <div><label>Unit</label><input id="add_unit" placeholder="Kg / PKT / Box"></div>
      <div><label>Amount</label><input id="add_amount" inputmode="decimal"></div>
      <div><label>Selling Rate</label><input id="add_selling" inputmode="decimal"></div>
      <div><label>Note</label><input id="add_note"></div>
    </div>
    <div class="add-actions">
      <button class="btn-add-submit" id="addSubmitBtn">➕ Add Item</button>
      <button class="btn-add-cancel" id="addCancelBtn">Cancel</button>
      <span class="add-status" id="addStatus"></span>
    </div>
  </div>
  <div class="stats" id="statsLine"></div>
  <div id="tableHost"><div class="loading">Loading…</div></div>
  <div class="footer-note" id="footerNote"></div>
</div>
<div id="toastHost"></div>
<div id="printArea"></div>
<script>
// ====== CONFIG ======
const API_URL = "https://script.google.com/macros/s/AKfycbxc19MtnIOcHvsXV8mib9z2pDDTSzH6J4Xi9pC45kl1GHbTHuc8ll9-_sVr8gN4MPQgFg/exec";
// =====================

const COLS = ['vendor','item_hi','item_en','rate','unit','amount','qty','weight','selling','note','verify'];
const LABELS = { item_hi:'Hindi', item_en:'English', rate:'Rate', unit:'Unit', amount:'Amount', weight:'Weight/Qty', selling:'Selling Rate', note:'Note' };
const DATA_START_ROW = 4;
let allRows = [];
let footerLines = [];

function esc(s) {
  const d = document.createElement('div');
  d.textContent = (s === undefined || s === null) ? '' : String(s);
  return d.innerHTML;
}

function setPill(state, text) {
  const el = document.getElementById('syncPill');
  el.className = 'sync-pill ' + state;
  el.textContent = text;
}

function showToast(message, kind) {
  const host = document.getElementById('toastHost');
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.innerHTML = message;
  host.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 250);
  }, 3400);
}

function computeQty(rate, amount) {
  const r = parseFloat(rate), a = parseFloat(amount);
  if (!isNaN(r) && r > 0 && !isNaN(a)) return (a / r).toFixed(1);
  return '';
}

async function loadData(showSpinner) {
  if (showSpinner) setPill('connecting', '⏳ Syncing…');
  try {
    const res = await fetch(API_URL, { method: 'GET', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const values = data.values || [];
    footerLines = values.slice(-2).map(r => r[0]).filter(Boolean);
    const dataRows = values.slice(3, values.length - 2);
    allRows = dataRows.map((r, idx) => {
      const obj = { row: DATA_START_ROW + idx, seq: r[11] !== undefined && r[11] !== '' ? r[11] : (idx + 1) };
      COLS.forEach((c, i) => obj[c] = r[i] !== undefined ? r[i] : '');
      return obj;
    });
    setPill('online', '🟢 Live — Sheet se connected');
    renderFooter();
    render(document.getElementById('searchBox').value);
  } catch (err) {
    setPill('offline', '🔴 Connect नहीं हो पाया — फिर कोशिश हो रही है');
    console.error(err);
  }
}

function renderFooter() {
  document.getElementById('footerNote').innerHTML =
    '✏️ Yahan edit karo ya seedha Google Sheet me — dono live sync hain. "Verify" dabane se row confirmed ho jaati hai.<br>' +
    footerLines.map(esc).join('<br>');
}

function verifyState(v) {
  const s = (v || '').trim().toLowerCase();
  if (s === 'yes') return 'unsure';
  if (s === 'no') return 'verified';
  return 'unset';
}

function render(filterText) {
  const host = document.getElementById('tableHost');
  const f = (filterText || '').trim().toLowerCase();
  const filtered = allRows.filter(r => {
    if (!f) return true;
    return (r.vendor + ' ' + r.item_hi + ' ' + r.item_en + ' ' + r.note).toLowerCase().includes(f);
  });
  document.getElementById('statsLine').textContent = filtered.length + ' / ' + allRows.length + ' items';

  if (filtered.length === 0) {
    host.innerHTML = '<div class="empty">कुछ नहीं मिला</div>';
    return;
  }

  let out = '<div class="table-scroll"><table>' +
    '<colgroup><col class="c-seq"><col class="c-vendor"><col class="c-hi"><col class="c-en"><col class="c-rate"><col class="c-unit">' +
    '<col class="c-amount"><col class="c-qty"><col class="c-selling"><col class="c-note">' +
    '<col class="c-verify"><col class="c-actions"></colgroup>' +
    '<thead><tr>' +
    '<th>#</th><th>Vendor</th><th>Hindi</th><th>English</th><th>Rate</th><th>Unit</th>' +
    '<th>Amount</th><th>Qty</th><th>Selling</th><th>Note</th><th>Verify</th><th>Actions</th>' +
    '</tr></thead><tbody>';

  for (const r of filtered) {
    const vs = verifyState(r.verify);
    const badgeClass = vs === 'unsure' ? 'yes' : (vs === 'verified' ? 'no' : 'neutral');
    const badgeText = vs === 'unsure' ? 'Needs check' : (vs === 'verified' ? 'OK' : '—');
    const alreadyVerified = vs === 'verified';
    out += '<tr class="' + (vs === 'unsure' ? 'unsure' : '') + '" data-row="' + r.row + '">' +
      '<td data-label="#">' + esc(r.seq) + '</td>' +
      '<td data-label="Vendor"><span class="vendor-text">' + esc(r.vendor) + '</span></td>' +
      '<td data-label="Hindi"><input class="cell" data-field="item_hi" value="' + esc(r.item_hi) + '"></td>' +
      '<td data-label="English"><input class="cell" data-field="item_en" value="' + esc(r.item_en) + '"></td>' +
      '<td data-label="Rate"><input class="cell num" data-field="rate" value="' + esc(r.rate) + '"></td>' +
      '<td data-label="Unit"><input class="cell" data-field="unit" value="' + esc(r.unit) + '"></td>' +
      '<td data-label="Amount"><input class="cell num" data-field="amount" value="' + esc(r.amount) + '"></td>' +
      '<td class="num" data-label="Qty">' + esc(r.qty || computeQty(r.rate, r.amount)) + '</td>' +
      '<td data-label="Selling"><input class="cell num" data-field="selling" value="' + esc(r.selling) + '"></td>' +
      '<td data-label="Note"><input class="cell" data-field="note" value="' + esc(r.note) + '"></td>' +
      '<td data-label="Verify"><span class="badge ' + badgeClass + '" data-badge>' + badgeText + '</span></td>' +
      '<td data-label="Actions"><div class="actions-cell">' +
        '<button class="btn btn-save" data-action="save">💾 Save</button>' +
        '<button class="btn btn-verify' + (alreadyVerified ? ' done' : '') + '" data-action="verify"' + (alreadyVerified ? ' disabled' : '') + '>' + (alreadyVerified ? '✅ Verified' : '✔ Verify') + '</button>' +
        '<span class="row-status"></span>' +
      '</div></td>' +
      '</tr>';
  }
  out += '</tbody></table></div>';
  host.innerHTML = out;

  host.querySelectorAll('button[data-action="save"]').forEach(btn => btn.addEventListener('click', onSaveRow));
  host.querySelectorAll('button[data-action="verify"]').forEach(btn => btn.addEventListener('click', onVerifyRow));
  host.querySelectorAll('input.cell').forEach(inp => {
    inp.addEventListener('input', () => inp.classList.add('changed'));
  });
}

function buildValuesFromRow(tr, localRow) {
  const values = COLS.map(c => {
    if (c === 'vendor') return localRow.vendor || '';
    if (c === 'weight') return localRow.weight || '';
    if (c === 'qty' || c === 'verify') return '';
    const input = tr.querySelector('[data-field="' + c + '"]');
    return input ? input.value : '';
  });
  const rateVal = tr.querySelector('[data-field="rate"]').value;
  const amountVal = tr.querySelector('[data-field="amount"]').value;
  values[6] = computeQty(rateVal, amountVal);
  return values;
}

async function pushRow(rowNum, values, statusEl, btn) {
  btn.disabled = true;
  if (statusEl) { statusEl.textContent = 'Saving…'; statusEl.className = 'row-status'; }
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'update', row: rowNum, values: values })
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'unknown error');
    return true;
  } catch (err) {
    if (statusEl) { statusEl.textContent = 'Error'; statusEl.className = 'row-status err'; }
    console.error(err);
    return false;
  } finally {
    if (!btn.classList.contains('done')) btn.disabled = false;
  }
}

async function onSaveRow(e) {
  const btn = e.currentTarget;
  const tr = btn.closest('tr');
  const rowNum = parseInt(tr.getAttribute('data-row'), 10);
  const localRow = allRows.find(r => r.row === rowNum);
  const statusEl = tr.querySelector('.row-status');

  const changedFields = [];
  COLS.forEach(c => {
    if (c === 'qty' || c === 'verify' || c === 'vendor') return;
    const input = tr.querySelector('[data-field="' + c + '"]');
    if (input && input.value !== (localRow[c] || '')) {
      changedFields.push({ field: c, value: input.value });
    }
  });

  const values = buildValuesFromRow(tr, localRow);
  values[10] = localRow.verify || '';
  const ok = await pushRow(rowNum, values, statusEl, btn);
  if (ok) {
    COLS.forEach((c, i) => { if (c !== 'qty') localRow[c] = values[i]; });
    localRow.qty = values[6];
    tr.querySelectorAll('input.cell').forEach(inp => inp.classList.remove('changed'));
    statusEl.textContent = 'Saved ✓';
    statusEl.className = 'row-status ok';
    if (changedFields.length) {
      const msg = '<b>' + esc(localRow.item_hi || localRow.item_en || 'Item') + '</b> update ho gaya — ' +
        changedFields.map(fl => (LABELS[fl.field] || fl.field) + ': <b>' + esc(fl.value || '—') + '</b>').join(', ');
      showToast(msg, 'ok');
    } else {
      showToast('Koi change nahi tha, phir bhi save kar diya ✓', 'ok');
    }
  } else {
    showToast('Save nahi ho paya, dobara try karein', 'err');
  }
}

async function onVerifyRow(e) {
  const btn = e.currentTarget;
  const tr = btn.closest('tr');
  const rowNum = parseInt(tr.getAttribute('data-row'), 10);
  const localRow = allRows.find(r => r.row === rowNum);
  const statusEl = tr.querySelector('.row-status');

  const values = buildValuesFromRow(tr, localRow);
  values[10] = 'No';
  const ok = await pushRow(rowNum, values, statusEl, btn);
  if (ok) {
    COLS.forEach((c, i) => { if (c !== 'qty') localRow[c] = values[i]; });
    localRow.qty = values[6];
    localRow.verify = 'No';
    tr.classList.remove('unsure');
    const badge = tr.querySelector('[data-badge]');
    badge.className = 'badge no';
    badge.textContent = 'OK';
    btn.textContent = '✅ Verified';
    btn.classList.add('done');
    btn.disabled = true;
    statusEl.textContent = 'Verified ✓';
    statusEl.className = 'row-status ok';
    showToast('<b>' + esc(localRow.item_hi || localRow.item_en || 'Item') + '</b> verified mark kar diya — Sheet me bhi update ho gaya', 'ok');
  } else {
    showToast('Verify karne me error aaya, dobara try karein', 'err');
  }
}

document.getElementById('searchBox').addEventListener('input', (e) => render(e.target.value));
document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));

const addPanel = document.getElementById('addPanel');
const addToggleBtn = document.getElementById('addToggleBtn');
const addCancelBtn = document.getElementById('addCancelBtn');
const addSubmitBtn = document.getElementById('addSubmitBtn');
const addStatus = document.getElementById('addStatus');

function clearAddForm() {
  ['add_vendor','add_item_hi','add_item_en','add_rate','add_unit','add_amount','add_selling','add_note']
    .forEach(id => document.getElementById(id).value = '');
  addStatus.textContent = '';
  addStatus.className = 'add-status';
}

addToggleBtn.addEventListener('click', () => {
  const opening = !addPanel.classList.contains('open');
  addPanel.classList.toggle('open');
  addToggleBtn.textContent = addPanel.classList.contains('open') ? '✕ Close' : '+ Add Item';
  if (opening) document.getElementById('add_item_hi').focus();
});

addCancelBtn.addEventListener('click', () => {
  addPanel.classList.remove('open');
  addToggleBtn.textContent = '+ Add Item';
  clearAddForm();
});

addSubmitBtn.addEventListener('click', async () => {
  const vendor = document.getElementById('add_vendor').value.trim();
  const item_hi = document.getElementById('add_item_hi').value.trim();
  const item_en = document.getElementById('add_item_en').value.trim();
  const rate = document.getElementById('add_rate').value.trim();
  const unit = document.getElementById('add_unit').value.trim();
  const amount = document.getElementById('add_amount').value.trim();
  const selling = document.getElementById('add_selling').value.trim();
  const note = document.getElementById('add_note').value.trim();

  if (!item_hi && !item_en) {
    addStatus.textContent = 'Kam se kam Hindi ya English naam bharein';
    addStatus.className = 'add-status err';
    return;
  }

  const qty = computeQty(rate, amount);
  const values = [vendor, item_hi, item_en, rate, unit, amount, qty, '', selling, note, ''];

  addSubmitBtn.disabled = true;
  addStatus.textContent = 'Add ho raha hai…';
  addStatus.className = 'add-status';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'append', values: values })
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'unknown error');
    showToast('<b>' + esc(item_hi || item_en) + '</b> add ho gaya — Sheet me bhi save ho gaya', 'ok');
    clearAddForm();
    addPanel.classList.remove('open');
    addToggleBtn.textContent = '+ Add Item';
    await loadData(true);
  } catch (err) {
    addStatus.textContent = 'Error — dobara try karein';
    addStatus.className = 'add-status err';
    console.error(err);
  } finally {
    addSubmitBtn.disabled = false;
  }
});

// ====== BILL / QUOTATION ======
const billToggleBtn = document.getElementById('billToggleBtn');
const billPanel = document.getElementById('billPanel');
const billSearch = document.getElementById('billSearch');
const billSuggest = document.getElementById('billSuggest');
const billPicked = document.getElementById('billPicked');
const billQtyInp = document.getElementById('bill_qty');
const billRateInp = document.getElementById('bill_rate');
const billAddBtn = document.getElementById('billAddBtn');
const billTableHost = document.getElementById('billTableHost');
const billSubtotalEl = document.getElementById('billSubtotal');
const billDiscountInp = document.getElementById('bill_discount');
const billGrandTotalEl = document.getElementById('billGrandTotal');
const billPrintBtn = document.getElementById('billPrintBtn');
const billClearBtn = document.getElementById('billClearBtn');
const billTypeSel = document.getElementById('bill_type');
const billCustomerInp = document.getElementById('bill_customer');
const billDateInp = document.getElementById('bill_date');

let billItems = [];
let billSelectedItem = null;

function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear();
}

function money(n) {
  const v = Number(n) || 0;
  return '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: 2 });
}

function openBillPanel() {
  billPanel.classList.add('open');
  billToggleBtn.textContent = '✕ Close';
  billDateInp.value = todayStr();
}

billToggleBtn.addEventListener('click', () => {
  const opening = !billPanel.classList.contains('open');
  if (opening) { openBillPanel(); }
  else { billPanel.classList.remove('open'); billToggleBtn.textContent = '🧾 New Bill'; }
  if (addPanel.classList.contains('open')) { addPanel.classList.remove('open'); addToggleBtn.textContent = '+ Add Item'; }
});

billSearch.addEventListener('input', () => {
  const f = billSearch.value.trim().toLowerCase();
  if (!f) { billSuggest.classList.remove('open'); billSuggest.innerHTML = ''; return; }
  const matches = allRows.filter(r =>
    (r.item_hi + ' ' + r.item_en).toLowerCase().includes(f)
  ).slice(0, 8);
  if (!matches.length) {
    billSuggest.innerHTML = '<div class="bill-suggest-item">कोई match नहीं मिला</div>';
    billSuggest.classList.add('open');
    return;
  }
  billSuggest.innerHTML = matches.map((r, i) =>
    '<div class="bill-suggest-item" data-idx="' + i + '">' +
      esc(r.item_hi || r.item_en) +
      (r.item_hi && r.item_en ? ' <span class="s-sub">(' + esc(r.item_en) + ')</span>' : '') +
      '<div class="s-sub">' + esc(r.unit || '') + (r.selling ? ' · Selling ₹' + esc(r.selling) : (r.rate ? ' · Rate ₹' + esc(r.rate) : '')) + '</div>' +
    '</div>'
  ).join('');
  billSuggest.classList.add('open');
  billSuggest.querySelectorAll('.bill-suggest-item[data-idx]').forEach(el => {
    el.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      const r = matches[parseInt(el.getAttribute('data-idx'), 10)];
      billSelectedItem = r;
      billPicked.textContent = r.item_hi || r.item_en;
      billPicked.classList.remove('empty');
      billRateInp.value = r.selling || r.rate || '';
      billQtyInp.value = '1';
      billSuggest.classList.remove('open');
      billSearch.value = '';
      billAddBtn.disabled = false;
      billQtyInp.focus();
    });
  });
});

billSearch.addEventListener('blur', () => setTimeout(() => billSuggest.classList.remove('open'), 150));

billAddBtn.addEventListener('click', () => {
  if (!billSelectedItem) return;
  const qty = parseFloat(billQtyInp.value) || 1;
  const rate = parseFloat(billRateInp.value) || 0;
  billItems.push({
    item_hi: billSelectedItem.item_hi,
    item_en: billSelectedItem.item_en,
    unit: billSelectedItem.unit,
    qty, rate
  });
  billSelectedItem = null;
  billPicked.textContent = 'Koi item select nahi kiya';
  billPicked.classList.add('empty');
  billQtyInp.value = '1';
  billRateInp.value = '';
  billAddBtn.disabled = true;
  renderBillTable();
});

function renderBillTable() {
  if (!billItems.length) {
    billTableHost.innerHTML = '<div class="bill-empty-hint">Abhi koi item bill me nahi hai — upar search karke add karein</div>';
    recalcBillTotals();
    return;
  }
  let out = '<table class="bill-table"><thead><tr>' +
    '<th>#</th><th>Item</th><th>Unit</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th></th>' +
    '</tr></thead><tbody>';
  billItems.forEach((it, i) => {
    const amt = (it.qty * it.rate) || 0;
    out += '<tr data-i="' + i + '">' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + esc(it.item_hi || it.item_en) + '</td>' +
      '<td>' + esc(it.unit || '') + '</td>' +
      '<td><input class="b-qty num" data-i="' + i + '" value="' + it.qty + '"></td>' +
      '<td><input class="b-rate num" data-i="' + i + '" value="' + it.rate + '"></td>' +
      '<td class="num">' + money(amt) + '</td>' +
      '<td><button class="btn-rm" data-i="' + i + '">✕</button></td>' +
      '</tr>';
  });
  out += '</tbody></table>';
  billTableHost.innerHTML = out;
  billTableHost.querySelectorAll('.b-qty, .b-rate').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = parseInt(inp.getAttribute('data-i'), 10);
      const val = parseFloat(inp.value) || 0;
      if (inp.classList.contains('b-qty')) billItems[i].qty = val; else billItems[i].rate = val;
      renderBillTable();
    });
  });
  billTableHost.querySelectorAll('.btn-rm').forEach(btn => {
    btn.addEventListener('click', () => {
      billItems.splice(parseInt(btn.getAttribute('data-i'), 10), 1);
      renderBillTable();
    });
  });
  recalcBillTotals();
}

function recalcBillTotals() {
  const subtotal = billItems.reduce((s, it) => s + (it.qty * it.rate || 0), 0);
  const discount = parseFloat(billDiscountInp.value) || 0;
  const grand = Math.max(0, subtotal - discount);
  billSubtotalEl.textContent = money(subtotal);
  billGrandTotalEl.textContent = money(grand);
}

billDiscountInp.addEventListener('input', recalcBillTotals);

billClearBtn.addEventListener('click', () => {
  billItems = [];
  billSelectedItem = null;
  billCustomerInp.value = '';
  billDiscountInp.value = '0';
  billPicked.textContent = 'Koi item select nahi kiya';
  billPicked.classList.add('empty');
  billAddBtn.disabled = true;
  renderBillTable();
});

billPrintBtn.addEventListener('click', () => {
  if (!billItems.length) {
    showToast('Pehle kam se kam ek item bill me add karein', 'err');
    return;
  }
  const customer = billCustomerInp.value.trim() || '—';
  const type = billTypeSel.value;
  const subtotal = billItems.reduce((s, it) => s + (it.qty * it.rate || 0), 0);
  const discount = parseFloat(billDiscountInp.value) || 0;
  const grand = Math.max(0, subtotal - discount);

  let rows = '';
  billItems.forEach((it, i) => {
    rows += '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + esc(it.item_hi || '') + (it.item_en ? ' <small>(' + esc(it.item_en) + ')</small>' : '') + '</td>' +
      '<td class="num">' + esc(it.qty) + ' ' + esc(it.unit || '') + '</td>' +
      '<td class="num">' + money(it.rate) + '</td>' +
      '<td class="num">' + money(it.qty * it.rate) + '</td>' +
      '</tr>';
  });

  document.getElementById('printArea').innerHTML =
    '<div class="pr-head"><h2>Sri Balaji Traders &amp; A.P. Traders</h2><div class="pr-sub">Wholesale Perfume &amp; General Stock · Tirupati</div></div>' +
    '<div class="pr-title">' + esc(type) + '</div>' +
    '<div class="pr-meta"><span><b>Customer:</b> ' + esc(customer) + '</span><span><b>Date:</b> ' + esc(billDateInp.value || todayStr()) + '</span></div>' +
    '<table class="pr-table"><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>' +
    rows + '</tbody></table>' +
    '<table class="pr-totals"><tr><td class="lbl">Subtotal</td><td class="val">' + money(subtotal) + '</td></tr>' +
    (discount > 0 ? '<tr><td class="lbl">Discount</td><td class="val">- ' + money(discount) + '</td></tr>' : '') +
    '<tr class="grand"><td class="lbl">Grand Total</td><td class="val">' + money(grand) + '</td></tr></table>' +
    '<div class="pr-foot"><span>Customer Signature</span><span>For Sri Balaji Traders &amp; A.P. Traders</span></div>';

  window.print();
});

loadData(true);
setInterval(() => loadData(false), 30000);
</script>
